name: Release

# npm trusted publishing (OIDC): no NPM_TOKEN. Configure the package's trusted publisher on npmjs.com after the first manual publish.
permissions:
  id-token: write
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install
      - run: bun run --filter logic-sdk test
      - name: Create a release PR, or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run changeset version
          publish-script: bun run release
