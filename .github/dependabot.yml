version: 2
updates:
  # GitHub Actions are pinned by SHA: keep them current
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"
    labels: ["dependencies", "github_actions"]

  # npm dependencies (bun.lock): security updates only. Version bumps are done by hand,
  # so the PR limit is 0 to turn off routine updates.
  - package-ecosystem: "bun"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
