name: Bug
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: What happened
      description: The smallest code that shows it, what you expected, and what happened instead (with the full error).
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: logic-sdk, runtime, database driver, jobs adapter
      placeholder: "logic-sdk 0.5.0, Node 24, postgres.js, databaseQueue(db)"
    validations:
      required: true
